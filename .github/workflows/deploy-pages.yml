name: Deploy Pages

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated Web build
        uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/
      - name: Deploy the completed Build run
        id: deployment
        uses: actions/deploy-pages@v4
