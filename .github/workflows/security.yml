name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-dependency-audit:
    name: dart-dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Resolve dependencies
        run: dart pub get
      - name: Audit outdated dependencies
        run: dart pub outdated
      - name: Dependency graph prerequisite
        run: |
          echo "::notice::GitHub Dependency Review becomes a required gate after Dependency Graph is enabled in repository security settings."

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  secret-patterns:
    name: secret-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject common private-key material
        shell: bash
        run: |
          if git grep -nE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- . ':!docs/**'; then
            echo "::error::Potential secret material detected"
            exit 1
          fi
          echo "No configured secret patterns detected."
