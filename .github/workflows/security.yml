name: Security

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart dependency audit
        run: dart pub outdated --no-dependency-overrides
      - name: Secret pattern gate
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='*.lock' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})' .

  dependency-review-prerequisite:
    name: Dependency Review prerequisite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Record unavailable native dependency review
        run: |
          echo "::notice::GitHub Dependency Review requires Dependency Graph."
          echo "::notice::It is currently unavailable for this repository; enable Dependency Graph in repository Security Analysis settings before promoting it to a required gate."
          echo "Executable dependency and secret controls are enforced by the Security audit job."
