name: Versioned Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-web-release:
    name: Build versioned Web/PWA release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate tag against pubspec version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          source = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$", source)
          if not match:
              raise SystemExit("pubspec.yaml must define a SemVer version with optional build number")
          expected = f"v{match.group(1)}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} must match pubspec.yaml version {expected!r}")
          print(f"Validated release tag {tag}")
          PY
      - name: Generate Flutter web scaffold
        run: flutter create --platforms=web --project-name universal_ssh .
      - run: flutter pub get
      - name: Build Pages-compatible Web/PWA
        run: flutter build web --release --base-href /universal-ssh/ --output build/web-release
      - name: Package release asset and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/web-release && zip -qr "$GITHUB_WORKSPACE/dist/universal-ssh-web-$RELEASE_TAG.zip" .)
          (cd dist && sha256sum "universal-ssh-web-$RELEASE_TAG.zip" > SHA256SUMS.txt)
          printf 'version=%s\ncommit=%s\n' "$RELEASE_TAG" "$GITHUB_SHA" > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-web-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-web-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: versioned-web-release
          path: dist
      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
