name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-gate:
    uses: ./.github/workflows/quality.yml

  build-web:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate official Flutter platform scaffolds
        run: flutter create --platforms=android,web --project-name universal_ssh .
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with: {name: flutter-web, path: build/web/, if-no-files-found: error}
  build-android:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate official Android scaffold
        run: flutter create --platforms=android --project-name universal_ssh .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: android-apk, path: build/app/outputs/flutter-apk/*.apk, if-no-files-found: error}
  build-uwp-x64:
    needs: [quality-gate, build-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with: {name: flutter-web, path: uwp/UniversalSshUwp/Web}
      - name: Generate placeholder UWP visual assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force uwp/UniversalSshUwp/Assets | Out-Null
          $sizes = @{"StoreLogo.png"=50;"Square44x44Logo.png"=44;"Square150x150Logo.png"=150;"Wide310x150Logo.png"=310;"SplashScreen.png"=620}
          foreach ($item in $sizes.GetEnumerator()) {
            $h = if ($item.Key -eq "Wide310x150Logo.png") {150} elseif ($item.Key -eq "SplashScreen.png") {300} else {$item.Value}
            $bmp = New-Object System.Drawing.Bitmap($item.Value,$h)
            $g=[System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::Black)
            $bmp.Save((Join-Path "uwp/UniversalSshUwp/Assets" $item.Key),[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
      - name: Validate modern UWP project contract
        shell: pwsh
        run: |
          [xml]$project = Get-Content uwp/UniversalSshUwp/UniversalSshUwp.csproj
          $properties = $project.Project.PropertyGroup
          if ($project.Project.Sdk -ne "Microsoft.NET.Sdk") { throw "UWP project must use Microsoft.NET.Sdk." }
          if ($properties.UseUwp -ne "true") { throw "UWP project must enable UseUwp." }
          if ($properties.PlatformTarget -ne "x64") { throw "UWP project must target x64." }
          if ([string]$properties.TargetFramework -notlike "net10.0-windows*") { throw "UWP project must target modern Windows .NET. Actual: $($properties.TargetFramework)" }
          if ($properties.RuntimeIdentifier -ne "win-x64") { throw "UWP project must use win-x64 RuntimeIdentifier." }
          if ($properties.PublishAot -ne "true") { throw "UWP project must keep Native AOT enabled." }
          if ($properties.SelfContained -ne "true") { throw "Native AOT UWP package must be self-contained." }

      - uses: microsoft/setup-msbuild@v2
      - name: Build unsigned UWP x64 package
        shell: pwsh
        run: msbuild uwp/UniversalSshUwp.sln /restore /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false
      - uses: actions/upload-artifact@v4
        with:
          name: uwp-x64
          path: |
            uwp/**/AppPackages/**/*.appx
            uwp/**/AppPackages/**/*.msix
          if-no-files-found: error
