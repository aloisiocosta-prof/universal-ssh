name: Build
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "android/**"
      - "uwp/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/quality.yml"
      - "docs/architecture/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "android/**"
      - "uwp/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build.yml"
      - ".github/workflows/quality.yml"
      - "docs/architecture/**"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    name: Detect affected build surfaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      uwp: ${{ steps.filter.outputs.uwp }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            web:
              - 'web/**'
            android:
              - 'android/**'
            uwp:
              - 'uwp/**'
            ci:
              - '.github/workflows/build.yml'
              - '.github/workflows/quality.yml'
              - 'docs/architecture/**'
              - 'README.md'

  architecture-diagrams:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Mermaid architecture diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mermaid
          python3 - <<'PY'
          from pathlib import Path
          import re
          out = Path('/tmp/mermaid')
          count = 0
          for doc in Path('docs/architecture').glob('*.md'):
              text = doc.read_text(encoding='utf-8')
              for block in re.findall(r'```mermaid\n(.*?)```', text, re.S):
                  count += 1
                  (out / f'{count:02d}.mmd').write_text(block, encoding='utf-8')
          if count != 19:
              raise SystemExit(f'Expected 19 Mermaid diagrams (18 semantic + 1 physical), found {count}')
          print(f'Validated catalog size: {count} diagrams (18 semantic + 1 physical)')

          readme = Path('README.md').read_text(encoding='utf-8')
          canonical = Path('docs/architecture/c4.md').read_text(encoding='utf-8')
          readme_blocks = re.findall(r'```mermaid\n(.*?)```', readme, re.S)
          canonical_blocks = re.findall(r'```mermaid\n(.*?)```', canonical, re.S)
          if len(readme_blocks) != 4:
              raise SystemExit(f'Expected 4 Mermaid C4 diagrams in README.md, found {len(readme_blocks)}')
          if readme_blocks != canonical_blocks:
              raise SystemExit('README C4 diagrams differ from docs/architecture/c4.md')
          print('README C4 diagrams match canonical architecture')

          inventory = Path('docs/architecture/files.md').read_text(encoding='utf-8')
          tracked = sorted(
              path.as_posix()
              for root in ('lib', 'test', 'uwp')
              for path in Path(root).rglob('*')
              if path.is_file()
          )
          documented = sorted(
              value
              for line in inventory.splitlines()
              if line.startswith('- ')
              for value in (line[2:].strip().strip(chr(96)),)
              if value.startswith(('lib/', 'test/', 'uwp/'))
          )
          if documented != tracked:
              missing = sorted(set(tracked) - set(documented))
              stale = sorted(set(documented) - set(tracked))
              raise SystemExit(
                  'Repository file inventory drift. '
                  f'Missing: {missing or "none"}; stale: {stale or "none"}'
              )
          print(f'Repository file inventory matches {len(tracked)} tracked files')
          PY
          mkdir -p /tmp/mermaid-rendered
          cat > /tmp/puppeteer.json <<'JSON'
          {"args":["--no-sandbox","--disable-setuid-sandbox"]}
          JSON
          for diagram in /tmp/mermaid/*.mmd; do
            name="$(basename "$diagram" .mmd)"
            echo "Rendering $name"
            npm exec --yes --package=@mermaid-js/mermaid-cli -- mmdc -p /tmp/puppeteer.json -i "$diagram" -o "/tmp/mermaid-rendered/$name.svg"
          done

  quality-gate:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/quality.yml

  build-web:
    needs: [changes, quality-gate]
    if: always() && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.uwp == 'true' || needs.changes.outputs.ci == 'true') && (needs.quality-gate.result == 'success' || needs.quality-gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate official Flutter platform scaffolds
        run: flutter create --platforms=android,web --project-name universal_ssh .
      - run: flutter pub get
      # Keep a root-relative build for the UWP WebView package.
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with: {name: flutter-web, path: build/web/, if-no-files-found: error}
      # Repository Pages sites are hosted below /<repository>/, unlike a custom domain.
      - name: Build GitHub Pages variant
        run: flutter build web --release --base-href /universal-ssh/ --output build/web-pages
      - name: Verify GitHub Pages base path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("build/web-pages/index.html").read_text(encoding="utf-8")
          expected = '<base href="/universal-ssh/">'
          if expected not in index:
              raise SystemExit(f"Expected {expected!r} in Pages index.html")
          print("GitHub Pages base path is correct.")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: flutter-web-pages, path: build/web-pages/, if-no-files-found: error}
      - name: Upload Pages build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web-pages/

  deploy-pages:
    name: Deploy build/web to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, build-web]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact build/web artifact
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    needs: [changes, quality-gate]
    if: always() && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.ci == 'true') && (needs.quality-gate.result == 'success' || needs.quality-gate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate official Android scaffold
        run: flutter create --platforms=android --project-name universal_ssh .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: android-apk, path: build/app/outputs/flutter-apk/*.apk, if-no-files-found: error}

  build-uwp-x64:
    needs: [changes, quality-gate, build-web]
    if: always() && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.uwp == 'true' || needs.changes.outputs.ci == 'true') && (needs.quality-gate.result == 'success' || needs.quality-gate.result == 'skipped') && needs.build-web.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with: {name: flutter-web, path: uwp/UniversalSshUwp/Web}
      - name: Generate placeholder UWP visual assets
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force uwp/UniversalSshUwp/Assets | Out-Null
          $sizes = @{"StoreLogo.png"=50;"Square44x44Logo.png"=44;"Square150x150Logo.png"=150;"Wide310x150Logo.png"=310;"SplashScreen.png"=620}
          foreach ($item in $sizes.GetEnumerator()) {
            $h = if ($item.Key -eq "Wide310x150Logo.png") {150} elseif ($item.Key -eq "SplashScreen.png") {300} else {$item.Value}
            $bmp = New-Object System.Drawing.Bitmap($item.Value,$h)
            $g=[System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::Black)
            $bmp.Save((Join-Path "uwp/UniversalSshUwp/Assets" $item.Key),[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
      - name: Validate modern UWP project contract
        shell: pwsh
        run: |
          [xml]$project = Get-Content uwp/UniversalSshUwp/UniversalSshUwp.csproj
          $properties = $project.Project.PropertyGroup
          if ($project.Project.Sdk -ne "Microsoft.NET.Sdk") { throw "UWP project must use Microsoft.NET.Sdk." }
          if ($properties.UseUwp -ne "true") { throw "UWP project must enable UseUwp." }
          if ($properties.PlatformTarget -ne "x64") { throw "UWP project must target x64." }
          if ([string]$properties.TargetFramework -notlike "net10.0-windows*") { throw "UWP project must target modern Windows .NET. Actual: $($properties.TargetFramework)" }
          if ($properties.RuntimeIdentifier -ne "win-x64") { throw "UWP project must use win-x64 RuntimeIdentifier." }
          if ($properties.PublishAot -ne "true") { throw "UWP project must keep Native AOT enabled." }
          if ($properties.SelfContained -ne "true") { throw "Native AOT UWP package must be self-contained." }

      - name: Run UWP host protocol tests
        shell: pwsh
        run: dotnet run --project uwp/UniversalSshUwp.ProtocolTests/UniversalSshUwp.ProtocolTests.csproj -c Release

      - uses: microsoft/setup-msbuild@v2
      - name: Build unsigned UWP x64 package
        shell: pwsh
        run: msbuild uwp/UniversalSshUwp.sln /restore /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false
      - uses: actions/upload-artifact@v4
        with:
          name: uwp-x64
          path: |
            uwp/**/AppPackages/**/*.appx
            uwp/**/AppPackages/**/*.msix
          if-no-files-found: error
